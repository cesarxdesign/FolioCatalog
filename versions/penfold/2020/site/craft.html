<title>Estimate prototype montage</title>
<!-- The "craft" montage (Figma "Penfold _new" 120:5379, 2212 x 1416), rebuilt as code so it can be
     tweaked. It was two screenshots of Figma taken 2020-04-22 (outline mode left of the diagonal,
     the designs right of it) with orange marks and handwritten notes on top.

     Everything is laid out in the craft frame's own units and scaled to the window width.
     - The 12 Estimate screens come from Figma "05 Estimate" (kt8yiHLl862LQIAT8GLvkP, section 10:4927,
       main component Estimate/mobile 10:2256). STATES below sets each one to the state it had in
       2020; values the file no longer holds (filled fields #FBFBFB, the 87% dot #4CD964) were read
       from the 2020 screenshot.
     - LINKS are the file's 59 prototype links, read from the Plugin API (hotspot box, destination).
       Figma's own connector routing is not exposed, so the curves are drawn here: they leave the
       hotspot's right edge and enter the facing side of the destination.
     - Figma's canvas zoom in the 2020 screenshot was 0.617363 canvas units per craft unit, with the
       prototype frame's corner at (47.5, 43.5) inside Frame 3. UI chrome (lines, circles, badges) is
       sized in craft units, as Figma draws it at a constant screen size.
     - SF Pro Text (status bar) cannot be shipped; the system font stands in. -->
<style>
@font-face{font-family:"Montserrat";src:url(fonts/Montserrat.woff2) format("woff2");font-weight:100 900}
/* Journal (Figma's note font) is not a Google font; Loved by the King stands in, tuned so its
   line widths and baseline match Journal's (same face as the 2020 page used). */
@font-face{font-family:"Journal fallback";src:url(fonts/LovedbytheKing.woff2) format("woff2");
     size-adjust:75%;ascent-override:99.1%;descent-override:40.9%;line-gap-override:0%}

:root{
  --navy:#123456; --pink:#FF5081; --g1:#FBFBFB; --g2:#F4F4F4; --g3:#F0F0F0; --g4:#D8D8D8; --lb:#E7EBED;
  --ol:#7B61FF;      /* Figma outline-mode purple */
  --proto:#18A0FB;   /* Figma prototype blue */
  --orange:rgba(255,154,2,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}   /* same scheme as the host's iframe element, or the browser paints the frame opaque */
html,body{background:transparent;overflow:hidden}   /* no panel around the frame: the host page shows through (2026-09-29) */
svg{display:block;overflow:visible}

/* ---------- the craft frame (2212 x 1416), scaled to the window by the script ---------- */
.craft{position:relative;width:2212px;height:1416px;background:transparent;transform-origin:0 0;
       transform:scale(var(--k,1)) translate(var(--cx,0),var(--cy,0))}
.frame3{position:absolute;left:227px;top:132px;width:1734px;height:1109px;overflow:hidden;background:#FFFFFF;border-radius:12px}   /* only the screens' frame keeps a white ground */
.layer{position:absolute;inset:0}
/* the cut runs from the bottom-left corner of the 2nd bottom screen through the top-right corner of the
   3rd top screen (moved 2026-09-29; the 2020 frame had it at the 4th top screen's top-left) */
.select{background:#FFFFFF;clip-path:polygon(862.5px 0,1754.5px 0,1754.5px 1109px,309.3px 1109px)}
.cutshadow{position:absolute;left:285px;top:-20px}
.view{position:absolute;left:47.5px;top:43.5px;width:2650px;height:1664px;transform-origin:0 0;
      transform:scale(.617363)}
.over{position:absolute;left:0;top:0;width:1734px;height:1109px}

/* ---------- one Estimate screen, 375 x 812 (Estimate/mobile) ---------- */
.scr{position:absolute;width:375px;height:812px;background:var(--g2);overflow:hidden;
     font-family:"Montserrat",sans-serif;color:var(--navy);font-feature-settings:"lnum" 1,"tnum" 1}
.abs{position:absolute}
.t{position:absolute;white-space:nowrap;line-height:normal}

.sb-bg{left:0;top:0;width:375px;height:63px;background:rgba(248,248,248,.7)}
.sb-div{left:0;top:62.5px;width:375px;height:.5px;background:rgba(0,0,0,.2)}
.sb-bar{left:0;top:0;width:375px;height:44px}
.sb-time{left:19.89px;top:14px;width:54px;text-align:center;font:600 15px/18px -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.165px;color:#000}
.sb-url{left:145px;top:40px;width:84px;text-align:center;font:400 12px -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.35px;color:#000;line-height:normal}
.sb-sig{left:293.5px;top:17.6px}
.sb-wifi{left:315.6px;top:17.4px}
.sb-bat{left:336px;top:17.16px}
.sb-batfill{left:338px;top:19.08px;width:18px;height:7.667px;border-radius:1.6px;background:#000}

.hd{left:0;top:63px;width:375px;height:72px}
.hd-bg{left:0;top:0;width:375px;height:72px;background:#FFFFFF;box-shadow:inset 0 0 0 .333px var(--g4)}
.hd-title{right:32px;top:35px;transform:translateY(-50%);font-weight:700;font-size:28px;letter-spacing:-.8px}
.hd-back{left:0;top:16px;width:120px;height:40px;display:flex;align-items:center}
.hd-chev{position:relative;width:40px;height:40px;flex:none}
.hd-lab{position:relative;padding:4px;flex:none}
.hd-labt{font-weight:700;font-size:20px;line-height:normal;white-space:nowrap}

.row-pay{left:0;top:135px;width:375px;height:129px}
.row-inc{left:0;top:264px;width:375px;height:177px}
.tf{width:148px;height:81px}
.tf-lab{left:0;bottom:52px;font-weight:700;font-size:24px;letter-spacing:-.8px}
.tf-box{left:0;bottom:0;width:148px;height:40px;border-radius:8px;background:#FFFFFF;box-shadow:inset 0 0 0 2px var(--g4)}
.tf-box.is-full{background:var(--g1);box-shadow:none}
.tf-val{left:16px;right:16px;top:calc(50% + .5px);transform:translateY(-50%);text-align:center;
        font-weight:600;font-size:24px;letter-spacing:-.8px;color:var(--g4)}
.tf-box.is-full .tf-val{color:var(--navy)}

.rec{width:65px;height:40px}
.rec-ic{left:13px;top:0;transform:scaleX(-1)}

.tg{width:66px;height:40px}
.tg-bg{inset:0;border-radius:20px;background:var(--lb);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.tg.is-on .tg-bg{background:var(--pink)}
.tg-cap{left:6px;top:6px;width:28px;height:28px;border-radius:50%;background:var(--g1);
        box-shadow:inset 0 0 0 1px #FFFFFF,0 2px 2px rgba(0,0,0,.16)}
.tg.is-on .tg-cap{left:32px}
.lab{left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);font-weight:500;font-size:12px}

.pill{width:66px;height:40px}
.pill-bg{inset:0;border-radius:20px;background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--lb)}
.pill-val{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:600;font-size:16px;letter-spacing:-.8px}
.stp{width:40px;height:40px}
.stp-pl{left:4px;top:4px;width:32px;height:32px;border-radius:20px;background:var(--g1);
        box-shadow:inset 0 0 0 1px #FFFFFF,0 2px 2px rgba(0,0,0,.16)}
.stp-t{left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;font-size:20px}

.helper{left:16px;top:417px;width:343px;height:75px;text-align:center;font-weight:400;font-size:12px;line-height:normal;white-space:normal}

.gr{left:0;top:441px;width:375px;height:152px}
.gr-dot{width:8px;height:8px;border-radius:4px}
.gr-title{left:57px;top:16px;font-size:10px;font-weight:400}
.gr-b{font-weight:700}
.gr-bars{left:39px;top:36px}
.gr-total{left:225px;width:90px;top:101px;text-align:right;font-weight:700;font-size:10px}
.gr-key{top:107px;transform:translateY(-50%);font-weight:400;font-size:8px}

.ctl{left:0;top:593px;width:375px;height:219px}
.ctl-bg{inset:0;background:var(--g3)}
.col40{left:131px;top:45px;width:114px;height:126px}
.save{left:0;top:80px;width:114px;height:46px;border-radius:8px;background:var(--lb);
      display:flex;align-items:center;justify-content:center}
.save.is-on{background:var(--pink)}
.save-t{position:relative;font-weight:700;font-size:20px;color:#FFFFFF;line-height:normal}

/* ---------- outline mode (Figma's Outline view): no paint, purple glyph outlines ---------- */
.ol .scr{background:none}
.ol .ink{background:none!important;box-shadow:none!important}
.ol .scr .t,.ol .scr .helper{color:transparent!important;-webkit-text-stroke:1.3px var(--ol)}
.ol .ic{--f:none;--s:var(--ol);--sw:1.3px}
.ol .scr .sb-url,.ol .scr .lab,.ol .scr .helper,.ol .scr .gr-title,.ol .scr .gr-key,.ol .scr .gr-total{-webkit-text-stroke-width:.7px}  /* small text: a thinner line keeps it legible */
.ol .gr-dot,.ol .sb-batfill{background:none}

/* ---------- annotations on top of the montage ---------- */
.mark{position:absolute;border-radius:8px;background:var(--orange);mix-blend-mode:multiply}
.mark.is-red{box-shadow:inset 0 0 0 4px #FF0000}
.spot{position:absolute;border-radius:50%;background:var(--orange);mix-blend-mode:multiply}
.arrow{position:absolute;left:0;top:0;transform-origin:0 0;fill:#000}
.alert{fill:none}

/* craft.html#bare: no grey around the white frame, which becomes the edge; the notes hang outside it
   on the host page, so they follow its light/dark theme (Penfold Imagine) */
.bare,.bare body,.bare .craft{background:transparent}
.bare .frame3{border-radius:12px}
/* dark: white ink with difference blending, so a note or arrow reads light on the page and dark where it
   crosses the white frame, as the black ink did in Figma */
.bare.dark .note,.bare.dark .arrow{color:#FFFFFF;fill:#FFFFFF;mix-blend-mode:difference}
.bare.dark .alert{fill:none;mix-blend-mode:normal}
.note{position:absolute;white-space:nowrap;color:#000;letter-spacing:0;
      font:400 44px/46.2px "Journal fallback",cursive}
</style>
</head>

function bars(b){
  let s='<svg class="abs gr-bars ic" width="296" height="61" viewBox="0 0 296 61"><clipPath id="bc"><rect width="296" height="61"/></clipPath><g clip-path="url(#bc)" stroke="var(--s,none)" stroke-width="var(--sw,0)">';
  for(const [hs,c] of [[b.light,'#5C85D6'],[b.dark,'#20499A']])
    hs.forEach((h,i)=>{s+=`<rect x="${18+10*i}" y="${64-h}" width="8" height="${h}" rx="${Math.min(4,h/2)}" fill="var(--f,${c})"/>`});
  return s+'<rect y="60" width="296" height="1" fill="var(--f,#FBFBFB)"/></g></svg>';
}

/* o-s / o-d: outlined solid or dashed in outline mode (shapes solid, frames and groups dashed). */
function field(label,val,x,y){
  const full=val!=='';
  return `<div class="abs tf o-d" style="left:${x}px;top:${y}px"><p class="t tf-lab">${label}</p>
    <div class="abs tf-box ink o-s${full?' is-full':''}"><p class="t tf-val">${full?val:'£'}</p></div></div>`;
}
function toggle(on,label,x,y){
  return `<div class="abs tg o-d${on?' is-on':''}" style="left:${x}px;top:${y}px"><div class="abs tg-bg ink o-s"></div><div class="abs tg-cap ink o-s"></div><p class="t lab">${label}</p></div>`;
}
function screen(st){
  let h=`<div class="abs sb-bg ink o-s"></div><div class="abs sb-div ink"></div>
    <div class="abs sb-bar o-d"></div><p class="t sb-time o-d">8:24</p><p class="t sb-url o-d">getpenfold.com</p>
    ${ICON.sig}${ICON.wifi}${ICON.bat}<div class="abs sb-batfill ink o-s"></div>
    <div class="abs hd o-d"><div class="abs hd-bg ink o-s"></div><p class="t hd-title">Estimate</p>
      <div class="abs hd-back"><div class="hd-chev o-d">${ICON.chev}</div><div class="hd-lab o-d"><p class="hd-labt t" style="position:relative">Back</p></div></div></div>
    <div class="abs row-pay o-d"></div>
    ${field('Pay-in amount',st.pay,32,159)}
    ${st.rec?`<div class="abs rec o-d" style="left:196px;top:200px">${ICON.rec(st.rec==='pink'?'#FF5081':'#D8D8D8')}</div>`:''}
    ${toggle(st.oneOff,'One off',277,200)}`;
  if(st.income!==null){
    h+=`<div class="abs row-inc o-d"></div>${field('Monthly income',st.income,32,288)}`;
    if(st.pct) h+=`<div class="abs pill o-d" style="left:277px;top:329px"><div class="abs pill-bg ink o-s"></div><p class="t pill-val">${st.pct}</p><p class="t lab">Save as a %</p></div>
      <div class="abs stp o-d" style="left:270px;top:377px"><div class="abs stp-pl ink o-s"></div><p class="t stp-t">-</p></div>
      <div class="abs stp o-d" style="left:310px;top:377px"><div class="abs stp-pl ink o-s"></div><p class="t stp-t">+</p></div>`;
  }
  if(st.helper) h+=`<p class="abs helper">Choose an amount to pay into your pension.<br><br>Start with a one off top up, or set it as a recurring monthly contribution. Define the value based on your income, or try to hit the 100% ideal savings goal.</p>`;
  if(st.chart){
    const b=BARS[st.chart];
    h+=`<div class="abs gr o-d"><div class="abs gr-dot ink o-s" style="left:45px;top:18px;background:${b.dot}"></div>
      <p class="t gr-title"><span class="gr-b">${st.chart}%</span> of ideal pot</p>${bars(b)}
      <div class="abs gr-dot ink o-s" style="left:57px;top:103px;background:#5C85D6"></div><p class="t gr-key" style="left:69px">Paid in</p>
      <div class="abs gr-dot ink o-s" style="left:107px;top:103px;background:#20499A"></div><p class="t gr-key" style="left:119px">Growth</p>
      <p class="t gr-total">Total pot: ${b.total}</p></div>`;
  }
  h+=`<div class="abs ctl"><div class="abs ctl-bg ink o-s"></div><div class="abs col40 o-d">
      ${toggle(st.salary,'Salary based',24,0)}
      <div class="abs save ink o-d${st.save?' is-on':''}"><p class="save-t t">Save</p></div></div></div>`;
  return h;
}

/* ======================= build ======================= */
const S=.617363, O={x:47.5,y:43.5};                 // canvas zoom and frame corner, in Frame 3
const P=(x,y)=>[O.x+S*x,O.y+S*y];                     // frame units -> Frame 3 craft units
const NS='http://www.w3.org/2000/svg';
const screens={};
for(const [id,st] of Object.entries(STATES)) screens[id]={...st, x:455*st.col, y:852*st.row};

for(const viewId of ['wireView','selectView']){
  const view=document.getElementById(viewId);
  for(const [id,s] of Object.entries(screens)){
    const el=document.createElement('div');
    el.className='scr'; el.style.left=s.x+'px'; el.style.top=s.y+'px'; el.dataset.id=id;
    el.innerHTML=screen(s);
    view.appendChild(el);
  }
}

/* Outline mode: trace every o-s / o-d box of the wire layer in purple, as Figma's Outline view does. */
function box(el,root){let x=0,y=0,n=el;while(n&&n!==root){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}return [x,y,el.offsetWidth,el.offsetHeight]}
for(const scr of document.querySelectorAll('#wireView .scr')){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','abs'); svg.setAttribute('width',375); svg.setAttribute('height',812);
  svg.style.left=0; svg.style.top=0;
  for(const el of scr.querySelectorAll('.o-s,.o-d')){
    const [x,y,w,h]=box(el,scr); if(!w||!h) continue;
    const r=document.createElementNS(NS,'rect');
    const rad=Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0,w/2,h/2);
    Object.entries({x:x+.81,y:y+.81,width:w-1.62,height:h-1.62,rx:rad,fill:'none',stroke:'#7B61FF','stroke-width':1.62}).forEach(([k,v])=>r.setAttribute(k,v));
    if(el.classList.contains('o-d')) r.setAttribute('stroke-dasharray','6.5 3.2');
    svg.appendChild(r);
  }
  scr.appendChild(svg);
}

/* ---------- Figma's UI over both layers: screen outlines, prototype connectors, selection ---------- */
const over=document.getElementById('over');
const add=(tag,attrs,parent=over)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const f=n=>+n.toFixed(2);

for(const s of Object.values(screens)){                // each screen's purple frame line
  const [x,y]=P(s.x,s.y);
  add('rect',{x:f(x+.25),y:f(y+.25),width:f(375*S-.5),height:f(812*S-.5),fill:'none',stroke:'#7B61FF','stroke-width':.5});
}

const lines=add('g',{fill:'none',stroke:'#18A0FB','stroke-width':1.5,'stroke-linecap':'round','stroke-linejoin':'round'});
const dots=add('g',{fill:'#FFFFFF',stroke:'#18A0FB','stroke-width':1.5});
for(const [hx,hy,hw,hh,dest] of LINKS){
  const row=hy>=1012?1:0;
  const fx=hx-80, fy=hy-(row?1012:80)+852*row;           // hotspot in frame units
  const src=screens[Object.keys(screens).find(k=>screens[k].col===Math.floor(fx/455)&&screens[k].row===row)];
  const d=screens[dest];
  const [sx,sy]=P(fx+hw,fy+hh/2);                          // the hotspot's right-middle
  let ex,ey,c1,c2;
  if(d.row!==src.row){                                     // another row: enter the facing edge's middle
    const below=d.row>src.row;
    [ex,ey]=P(d.x+187.5,below?d.y:d.y+812);
    const kx=Math.abs(ex-sx)*.5*Math.sign(ex-sx), ky=Math.max(Math.abs(ey-sy)*.5,24)*(below?1:-1);
    c1=[sx+kx,sy]; c2=[ex,ey-ky];                          // leaves sideways, arrives upright
  }else{                                                   // same row: enter the facing side's middle
    const right=d.col>src.col;
    [ex,ey]=P(right?d.x:d.x+375,d.y+406);
    const k=Math.max(Math.abs(ex-sx)*.5,24)*(right?1:-1);
    c1=[sx+k,sy]; c2=[ex-k,ey];
  }
  add('path',{d:`M${f(sx)} ${f(sy)}C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(ex)} ${f(ey)}`},lines);
  const a=Math.atan2(ey-c2[1],ex-c2[0]), L=6;              // arrowhead, tip on the edge
  const p1=[ex-L*Math.cos(a-Math.PI/4),ey-L*Math.sin(a-Math.PI/4)], p2=[ex-L*Math.cos(a+Math.PI/4),ey-L*Math.sin(a+Math.PI/4)];
  add('path',{d:`M${f(p1[0])} ${f(p1[1])}L${f(ex)} ${f(ey)}L${f(p2[0])} ${f(p2[1])}`},lines);
  add('circle',{cx:f(sx),cy:f(sy),r:2.9},dots);
}

/* the selected frame (blue line, corner handles, size badge, flow-start badge) was cut on request, 2026-09-29 */

/* ---------- #bare: transparent page, notes in the host page's theme ---------- */
if(/(^|[#&])bare\b/.test(location.hash)){
  const root=document.documentElement; root.classList.add('bare');
  try{const pg=parent.document.querySelector('.page[data-theme]');
    const sync=()=>root.classList.toggle('dark',pg.getAttribute('data-theme')==='dark');
    sync(); new MutationObserver(sync).observe(pg,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
}

/* ---------- fit the frame to the window; craft.html#crop=x,y,w,h shows only that box ---------- */
const crop=((location.hash.match(/crop=([-\d.,]+)/)||[])[1]||'0,0,2212').split(',').map(Number);
const fit=()=>{const c=document.getElementById('craft').style;
  c.setProperty('--k',innerWidth/crop[2]); c.setProperty('--cx',-crop[0]+'px'); c.setProperty('--cy',-crop[1]+'px')};
fit(); addEventListener('resize',fit);
</script>
